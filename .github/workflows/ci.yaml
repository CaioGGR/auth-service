name: "CI & DevSecOps Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster-auth

jobs:
  build-test-security:
    name: "Build, Test & Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # Dependências, Linter e Testes
      - name: "Linter & Testes Unitários"
        run: |
          go mod tidy
          go vet ./...
          go test -v ./...

      # SAST - Análise Estática de Código
      - name: "SAST Scan - Gosec"
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec ./... || true

      # SCA - Análise de Dependências (Bloqueio por Vulnerabilidades CRÍTICAS)
      - name: "SCA Scan - Trivy (FileSystem)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

  docker-build-push:
    name: "Docker Build, Scan & Push"
    needs: build-test-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Configurar Credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Login no Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Build da Imagem Docker"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Scan da Imagem Docker
      - name: "Container Image Scan - Trivy"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      # Push para o ECR
      - name: "Push da Imagem para o ECR"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # --- Atualizar a Tag da Imagem no Repositório GitOps ---
      - name: Atualizar Tag da Imagem no GitOps
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Clona o repositório de manifestos usando o token
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/CaioGGR/toggle-master-k8s-docker.git gitops-repo
          cd gitops-repo

          # 2. Atualiza a tag dentro de k8s/02-services.yaml
          sed -i "s|togglemaster-auth:.*|togglemaster-auth:${IMAGE_TAG}|g" k8s/02-services.yaml

          # 3. Comita e envia a nova tag para o GitHub
          git add k8s/02-services.yaml
          git commit -m "chore(ci): update auth-service image tag to ${IMAGE_TAG}" || exit 0
          git push origin main
